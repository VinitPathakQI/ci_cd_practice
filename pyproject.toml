[project]
name = "ci-practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "VinitPathakQI", email = "vinit.pathak@quantumintegrators.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests"
]

[project.scripts]
ci-practice = "ci_practice:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
extend-select = [
    "I",   # import sorting
    "B",   # likely bugs (flake8-bugbear)
    "UP",  # outdated Python syntax
]